[package]
name = "rpi-superagent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Super-agent orchestration for the rpi Rust agent: DAG execution plus a Ticket domain layer"
readme = "README.md"
keywords = ["rpi", "subagent", "orchestration", "superagent", "plugin"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
# The supervisor: a separate process that outlives the session that started it.
# It is a binary rather than a thread because a thread dies with its host, and
# a host that dies leaves its children running with nobody to collect them.
# Named `-supervisor` so its debug-info stem does not collide with the
# `rpi_superagent` cdylib in the same package.
name = "rpi-superagent-supervisor"
path = "src/bin/supervisor.rs"

[[bin]]
# The pass scheduler: the process that drives the effect queue when the host
# that queued the work may exit at any moment. A thread cannot do this job — it
# dies with its host — so the queue is durable on disk and this program is what
# reads it. Named `-passes` for the same reason the supervisor is named rather
# than sharing the package's stem.
name = "rpi-superagent-passes"
path = "src/bin/passes.rs"

[dependencies]
rpi-plugin-sdk = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
wait-timeout = { workspace = true }
