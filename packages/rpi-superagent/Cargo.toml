[package]
name = "rpi-superagent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Super-agent orchestration for the rpi Rust agent: DAG execution plus a Ticket domain layer"
readme = "README.md"
keywords = ["rpi", "subagent", "orchestration", "superagent", "plugin"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
# The supervisor: a separate process that outlives the session that started it.
# It is a binary rather than a thread because a thread dies with its host, and
# a host that dies leaves its children running with nobody to collect them.
# Named `-supervisor` so its debug-info stem does not collide with the
# `rpi_superagent` cdylib in the same package.
name = "rpi-superagent-supervisor"
path = "src/bin/supervisor.rs"

[[bin]]
# The daemon: drives the effect queue and sweeps orphaned workers, in the process
# that outlives the host that queued the work. A thread cannot do this job — it
# dies with its host. The two jobs share one process because they were separate
# before and the split bought nothing: two locks, two logs, two launches, and no
# way for the sweep to tell the queue what it saw.
name = "rpi-superagent-daemon"
path = "src/bin/passes.rs"

[dependencies]
rpi-plugin-sdk = { workspace = true, features = ["process"] }
serde = { workspace = true }
serde_json = { workspace = true }
wait-timeout = { workspace = true }
