[package]
name = "rpi-superagent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Super-agent orchestration for the rpi Rust agent: DAG execution plus a Ticket domain layer"
readme = "README.md"
keywords = ["rpi", "subagent", "orchestration", "superagent", "plugin"]
categories = ["development-tools"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rpi-plugin-sdk = { workspace = true, features = ["process"] }
serde_json = { workspace = true }
wait-timeout = { workspace = true }
